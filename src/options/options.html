<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LowP - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <header class="header">
      <div class="brand">
        <div class="logo-circle">⚙️</div>
        <div>
          <h1>Settings</h1>
          <p>LowP Preferences and Developer Tools</p>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="list-section">
        <h2>Store discounts and cashback</h2>
        <p>Card discounts apply to the product subtotal. Only the highest eligible cashback applies. Verify each offer at checkout.</p>
        <label for="offerStore">Store</label><select id="offerStore"></select>
        <form id="offerForm">
          <label for="cardPercent">Card discount (%)</label><input id="cardPercent" type="number" min="0" max="100" step="0.01" required>
          <h3>Cashback milestones</h3><div id="tiers"></div>
          <button type="button" id="addTier">Add milestone</button>
          <button type="submit">Save offers</button><p id="offerStatus" role="status"></p>
        </form>
      </section>
      <!-- Developer Options -->
      <section class="list-section">
        <h2>Developer</h2>
        <label class="debug-toggle-row" for="debugToggle" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;">
          <input type="checkbox" id="debugToggle" style="width:18px;height:18px;" />
          <span>Enable debug logging <span style="color:#94A3B8;">(telemetry shown in the panel's Debug Inspector)</span></span>
        </label>
      </section>
    </main>
  </div>

  <script src="../shared/mobile-core.js"></script>
  <script src="options.js"></script>
</body>
</html>
