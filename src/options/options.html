<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LowP - Location Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <header class="header">
      <div class="brand">
        <div class="logo-circle">⚙️</div>
        <div>
          <h1>Settings</h1>
          <p>LowP Preferences and Developer Tools</p>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Developer Options -->
      <section class="list-section">
        <h2>Developer</h2>
        <label class="debug-toggle-row" for="debugToggle" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;">
          <input type="checkbox" id="debugToggle" style="width:18px;height:18px;" />
          <span>Enable debug logging <span style="color:#94A3B8;">(telemetry shown in the panel's Debug Inspector)</span></span>
        </label>
      </section>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
