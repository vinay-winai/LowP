<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LowP - Hyperlocal Price Comparator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-circle">⚡</div>
        <div>
          <h1 class="logo-title">LowP</h1>
          <span class="logo-sub">Hyperlocal Real-Time Comparator</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="openMatrixBtn" class="clear-cache-btn" title="View Strategy Matrix (Basket Optimizer)">📊 Matrix (<span id="matrixCount">0</span>)</button>
        <button id="openSidePanelBtn" class="clear-cache-btn" title="Open persistent Side Panel (won't close on clicks)">📑 Pin to Side</button>
        <button id="clearCacheBtn" class="clear-cache-btn" title="Clear search cache (keeps saved addresses)">🗑️ Clear Cache</button>
        <div class="location-pill" id="locationPill" title="Change location">
          <span class="loc-icon">📍</span>
          <span class="loc-text" id="activeLocationText">Hyderabad (500085)</span>
        </div>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search products (e.g. Milky Mist high protein paneer 200g)..." 
          autocomplete="off"
        />
        <button id="searchBtn" class="search-btn" title="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <!-- Strategy Matrix Action Bar -->
      <div class="cart-action-bar" id="cartActionBar">
        <button id="addToMatrixBtn" class="add-to-matrix-btn" disabled>
          <span class="cart-btn-icon">🛒</span>
          <span id="addToMatrixText">+ Add to Strategy Matrix</span>
        </button>
        <button id="viewMatrixBtn" class="view-matrix-btn">
          <span>📊 View Matrix</span>
        </button>
      </div>
    </section>

    <!-- Strategy Matrix Modal -->
    <div class="modal-backdrop" id="matrixModalBackdrop" style="display: none;">
      <div class="modal-content matrix-modal">
        <div class="modal-header">
          <div class="matrix-modal-title-box">
            <span class="matrix-modal-icon">🛒</span>
            <div>
              <h3 class="matrix-modal-title">Strategy Matrix</h3>
              <span class="matrix-modal-sub" id="matrixItemCountText">0 Items in Basket • Multi-Store Arbitrage</span>
            </div>
          </div>
          <div class="matrix-modal-actions">
            <button id="clearMatrixBtn" class="clear-matrix-btn">Clear All</button>
            <button id="closeMatrixBtn" class="close-modal-btn">✕</button>
          </div>
        </div>
        <div class="modal-body matrix-modal-body" id="matrixModalBody">
          <!-- Injected dynamically -->
        </div>
      </div>
    </div>

    <!-- Results Section -->
    <main class="results-section" id="resultsSection">
      <div class="loading-state" id="loadingState" style="display: none;">
        <div class="spinner"></div>
        <p class="loading-text">Comparing live prices across Amazon, Instamart & Zepto...</p>
      </div>

      <div class="cards-grid" id="cardsGrid">
        <!-- Injected dynamically -->
      </div>
    </main>

    <!-- Footer & Debug Inspector -->
    <footer class="footer">
      <div class="footer-links">
        <button id="toggleDebugBtn" class="debug-toggle-btn">🛠️ Debug Inspector</button>
        <button id="copyDebugBtn" class="copy-debug-btn" style="display: none;">📋 Copy Debug Log</button>
      </div>

      <div id="debugDrawer" class="debug-drawer" style="display: none;">
        <div class="debug-header">
          <span>Live Telemetry Log</span>
          <button id="clearDebugBtn" class="clear-btn">Clear</button>
        </div>
        <pre id="debugOutput" class="debug-output">No logs recorded yet. Search a product to view telemetry.</pre>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
